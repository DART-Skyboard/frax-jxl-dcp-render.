schema_version = "1.0.0"

id = "frax_jxl_dcp_render"
version = "1.2.5"
name = "Frax JXL DCP Render"
tagline = "Render to JPEG XL stills and animations, and festival DCPs"
authors = ["Justin Venable CEO @ Radical Deepscale | DART Meadow"]
maintainer = "Radical Deepscale <justin@dartmeadow.com>"
type = "add-on"
website = "https://radicaldeepscale.com/frax.html"
tracker_url = "https://radicaldeepscale.com/frax.html"
tags = ["Render"]

blender_version_min = "5.2.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Radical Deepscale LLC", "2021 the JPEG XL Project Authors (libjxl, BSD-3-Clause)"]

platforms = ["windows-x64", "windows-arm64", "macos-arm64", "macos-x64", "linux-x64"]
wheels = [
  "./wheels/frax_libjxl-0.13.0.1-py3-none-any.whl",
  "./wheels/wasmtime-48.0.0-py3-none-macosx_10_13_x86_64.whl",
  "./wheels/wasmtime-48.0.0-py3-none-macosx_11_0_arm64.whl",
  "./wheels/wasmtime-48.0.0-py3-none-manylinux1_x86_64.whl",
  "./wheels/wasmtime-48.0.0-py3-none-win_amd64.whl",
  "./wheels/wasmtime-48.0.0-py3-none-win_arm64.whl",
]

[permissions]
files = "Reads rendered frames and writes JPEG XL / DCP files you choose"

[build]
paths_exclude_pattern = ["__pycache__/", "/.git/", "*.zip", "/tests/", "/build/", "/build.sh", "/.gitignore"]
